  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #050510;
      --bg-card: rgba(15, 15, 40, 0.7);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240, 240, 245, 0.7);
      --text-muted: rgba(240, 240, 245, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-heading: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59, 130, 246, 0.12), transparent);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 48px 16px 80px; }
    .gate { max-width: 360px; margin: 18vh auto 0; padding: 32px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; text-align: center; }
    .gate h1 { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 16px; }
    .gate input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.05); color: var(--text-primary); font-size: 1rem; }
    .gate button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
    .gate .err { color: #f87171; margin-top: 10px; min-height: 1.4em; font-size: 0.9rem; }
    #doc h1 { font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 4px; }
    #doc h2 { font-family: var(--font-heading); font-size: 1.4rem; margin: 40px 0 12px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
    #doc p, #doc ol { margin-bottom: 14px; color: var(--text-secondary); }
    #doc ol { padding-left: 22px; }
    #doc li { margin-bottom: 8px; }
    #doc strong { color: var(--text-primary); }
    #doc em { color: var(--text-muted); }
    #doc table { width: 100%; border-collapse: collapse; margin: 8px 0 18px; font-size: 0.92rem; display: block; overflow-x: auto; }
    #doc th, #doc td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
    #doc th { color: var(--text-primary); font-weight: 600; background: rgba(255,255,255,0.03); }
    #doc td { color: var(--text-secondary); }
    #doc figure { margin: 8px 0 18px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; }
    #doc figure svg { width: 100%; height: auto; display: block; font-family: var(--font-body); }
    #doc figcaption { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }
  </style>
</head>

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function unlock(pw) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BLOB.s), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.i) }, key, b64(BLOB.c));
      return new TextDecoder().decode(plain);
    }
    async function show(pw) {
      const html = await unlock(pw);
      const doc = document.getElementById('doc');
      doc.innerHTML = html;
      doc.hidden = false;
      document.getElementById('gate').remove();
      try { sessionStorage.setItem('planpw', pw); } catch (e) {}
    }
    document.getElementById('gate').addEventListener('submit', async e => {
      e.preventDefault();
      try { await show(document.getElementById('pw').value); }
      catch (err) { document.getElementById('err').textContent = 'Wrong password.'; }
    });
    try { const saved = sessionStorage.getItem('planpw'); if (saved) show(saved).catch(() => {}); } catch (e) {}
  </script>
