<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8 AI Model Types - AI Innovators of Huntsville</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eight specialized AI model types (LLM, LCM, LAM, MoE, VLM, SLM, MLM, SAM) with pipelines, concrete examples, living catalogs, and one scenario that connects them.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="alternate" type="application/json" href="models.json" title="Machine-readable version">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: clamp(16px, 0.75vw + 8px, 24px); }

    :root {
      --bg-primary: #050510;
      --bg-card: rgba(15, 15, 40, 0.7);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240, 240, 245, 0.7);
      --text-muted: rgba(240, 240, 245, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(139, 92, 246, 0.3);
      --font-heading: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59, 130, 246, 0.12), transparent),
        radial-gradient(ellipse 60% 50% at 80% 50%, rgba(139, 92, 246, 0.08), transparent),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(6, 182, 212, 0.06), transparent);
      background-attachment: fixed;
    }

    a { color: var(--accent-cyan); }

    .container { width: 100%; height: 100vh; height: 100dvh; padding: 16px 16px 12px; display: flex; flex-direction: column; overflow: hidden; }
    @media (min-width: 900px) { .container { padding: 20px 24px 14px; } }

    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text-primary); text-decoration: none; font-family: var(--font-heading); font-weight: 600; }
    .brand img { height: 32px; }

    h1 { font-family: var(--font-heading); font-size: clamp(1.8rem, 4vw, 3.4rem); line-height: 1.15; margin-bottom: 8px; }
    h1 span { background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { color: var(--text-secondary); max-width: 52em; margin-bottom: 14px; font-size: 1rem; }

    .hero { display: flex; justify-content: space-between; align-items: center; gap: 32px; }
    .hero-qr { flex-shrink: 0; text-align: center; margin-bottom: 16px; }
    .hero-qr img { display: block; width: clamp(100px, 8vw, 180px); height: auto; padding: 10px; background: #fff; border-radius: 12px; }
    @media (max-width: 720px) { .hero-qr, .lede { display: none; } h1 { margin-bottom: 12px; } }

    /* Pager tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tab {
      font-family: var(--font-heading); font-weight: 600; font-size: 0.9rem;
      background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      padding: 8px 12px; cursor: pointer; flex: 1 1 auto; white-space: nowrap;
    }
    .tab:hover { color: var(--text-primary); }
    .tab[aria-selected="true"] { color: var(--text-primary); border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); }
    .tab .step { color: var(--text-muted); font-weight: 400; margin-right: 4px; }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: 16px; padding: 28px; backdrop-filter: blur(10px);
      flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    }
    /* One screen per page: content flows into columns; overflow columns become sub-pages. */
    .card section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .card .cols {
      flex: 1; min-height: 0; overflow: hidden;
      column-count: 2; column-gap: 48px; column-fill: auto;
    }
    .card .cols.balanced { column-fill: balance;
    }
    @media (max-width: 899px) { .card .cols { column-count: 1; } }
    .cols > *, .cols li, .cols p, .cols pre { break-inside: avoid; }
    .cols ul.items { break-inside: auto; }
    .cols h3 { break-after: avoid; }
    .cols > :first-child { margin-top: 0; }
    .cols .grid { display: contents; }
    .card h2 { font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 6px; }
    .card h3 { font-family: var(--font-heading); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-cyan); margin: 22px 0 8px; }
    .card p { color: var(--text-secondary); }
    .card p + p { margin-top: 10px; }
    .card strong { color: var(--text-primary); }
    .card section[hidden] { display: none; }
    .card h2 + .cols { margin-top: 10px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .card { padding: 20px; } }

    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .flow span {
      font-size: 0.82rem; padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(6, 182, 212, 0.35); background: rgba(6, 182, 212, 0.08);
    }
    .flow i { color: var(--text-muted); font-style: normal; font-size: 0.8rem; }
    /* Pipeline: one step per line on a vertical rail, so steps never wrap mid-flow. */
    ol.steps { list-style: none; counter-reset: step; break-inside: avoid; position: relative; }
    ol.steps::before { content: ''; position: absolute; left: 0.7rem; top: 0.9rem; bottom: 0.9rem; width: 1px; background: rgba(6, 182, 212, 0.35); }
    ol.steps li { counter-increment: step; position: relative; padding: 3px 0 3px 2.2rem; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; }
    ol.steps li::before {
      content: counter(step); position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center;
      font-family: var(--font-heading); font-size: 0.7rem; font-weight: 600; color: var(--text-primary);
      background: #0b1024; border: 1px solid rgba(6, 182, 212, 0.6);
    }

    .callout { border-left: 3px solid var(--accent-purple); padding: 10px 14px; background: rgba(139, 92, 246, 0.07); border-radius: 0 8px 8px 0; margin-top: 14px; }
    .callout p { color: var(--text-secondary); }

    ul.items { list-style: none; }
    ul.items li { padding: 10px 0; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.95rem; }
    ul.items li:last-child { border-bottom: none; }
    ul.items strong { display: block; font-family: var(--font-heading); }

    pre {
      font-size: 0.82rem; line-height: 1.5; white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border-subtle);
      border-radius: 10px; padding: 12px 14px; color: var(--text-secondary);
    }

    /* Probability demo */
    .demo { margin-top: 8px; }
    .bar-row { display: grid; grid-template-columns: 7em 1fr 52px; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.9rem; }
    .bar-row .label { font-family: var(--font-heading); font-weight: 600; }
    .bar-track { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--accent-gradient); transition: width 0.2s; }
    .bar-row .pct { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .slider { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 0.9rem; color: var(--text-secondary); flex-wrap: wrap; }
    .slider input { flex: 1; min-width: 160px; accent-color: var(--accent-purple); }
    .slider output { font-family: var(--font-heading); color: var(--text-primary); min-width: 32px; }

    .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
    .pager button {
      background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-subtle);
      border-radius: 8px; padding: 10px 16px; font-family: var(--font-heading); font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .pager button:disabled { opacity: 0.35; cursor: default; }
    .pager .count { color: var(--text-muted); font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
    .dots { display: inline-flex; gap: 6px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-subtle); }
    .dots i.on { background: var(--accent-purple); }

    /* Phones: keep the pager on one line and give the slide the height. */
    .pager button { white-space: nowrap; flex-shrink: 0; }
    .pager .count { flex: 1; min-width: 0; justify-content: center; white-space: nowrap; }
    .dots { flex-wrap: nowrap; overflow: hidden; }
    @media (max-width: 720px) {
      h1 { font-size: 1.6rem; }
      .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { flex: none; }
      .pager button { padding: 10px 14px; }
    }
    footer { margin-top: 8px; color: var(--text-muted); font-size: 0.8rem; text-align: center; }
  
    /* Model pages */
    .card h2 small { font-size: 1rem; color: var(--text-secondary); font-weight: 500; margin-left: 8px; }
    .scenario { border-left: 3px solid var(--accent-purple); padding: 10px 14px; background: rgba(139, 92, 246, 0.07); border-radius: 0 8px 8px 0; }
    .scenario .handoff { display: block; margin-top: 6px; font-size: 0.85rem; color: var(--text-muted); }
    ul.links { list-style: none; }
    ul.links li { padding: 6px 0; border-bottom: 1px solid var(--border-subtle); font-size: 0.92rem; }
    ul.links li:last-child { border-bottom: none; }
    ul.links .meta { color: var(--text-muted); font-size: 0.8rem; margin-left: 6px; }
    .note { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; }
    dl.dims { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 0.9rem; }
    dl.dims dt { color: var(--text-muted); text-transform: capitalize; }
    dl.dims dd { color: var(--text-secondary); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
    th { font-family: var(--font-heading); color: var(--accent-cyan); font-weight: 600; text-transform: capitalize; }
    td:first-child { font-family: var(--font-heading); font-weight: 600; color: var(--text-primary); white-space: nowrap; }
    td { color: var(--text-secondary); }
    ol.chain { padding-left: 20px; color: var(--text-secondary); }
    ol.chain li { margin: 6px 0; }
    ol.chain a { font-family: var(--font-heading); font-weight: 600; text-decoration: none; }
    /* The comparison tables are too wide for two columns: one per slide. */
    .card .cols.wide { column-count: 1; }
    .cols.wide table { font-size: 0.85rem; margin-top: 14px; }
    .cols.wide th, .cols.wide td { padding: 5px 8px; line-height: 1.35; }
    .json-link { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="brand" href="index.html"><img src="aiihsv-logo-complete.png" alt="">AI Innovators HSV</a>
    </header>

    <div class="hero">
      <div>
    <h1>8 Specialized <span>AI Model Types</span></h1>
    <p class="lede" id="lede">Loading...</p>
      </div>
      <div class="hero-qr">
        <img src="models-qr.svg" alt="QR code for this page">
      </div>
    </div>

    <nav class="tabs" role="tablist" id="tabs"></nav>

    <main class="card" role="tabpanel" aria-live="polite" id="page"></main>

    <div class="pager">
      <button id="prev" type="button">&larr; Prev</button>
      <span class="count" id="count"></span>
      <button id="next" type="button">Next &rarr;</button>
    </div>

    <footer id="footer"></footer>
  </div>

  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      let data;
      try {
        const res = await fetch('models.json', { cache: 'no-cache' });
        data = await res.json();
      } catch (e) {
        $('lede').innerHTML = 'Could not load the catalog. Open <a href="models.json">models.json</a> directly.';
        return;
      }

      const byId = Object.fromEntries(data.models.map((m) => [m.id, m]));
      const chain = data.scenario.order.map((id) => byId[id]);

      $('lede').textContent = data.about;
      $('footer').innerHTML = 'AI Innovators of Huntsville &middot; Updated ' + esc(data.updated) +
        ' &middot; <a class="json-link" href="models.json">Machine-readable version (JSON)</a>';

      const linkList = (items, metaKey) => '<ul class="links">' + items.map((x) =>
        '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.name) + '</a>' +
        '<span class="meta">' + esc(x[metaKey]) + '</span></li>'
      ).join('') + '</ul>';
      function renderOverview() {
        const s = data.scenario;
        return '<h2>' + esc(s.title) + '</h2>' +
          '<h3>The one idea</h3><p>' + esc(data.unifying_idea) + '</p>' +
          '<h3>The scenario</h3><p>' + esc(s.setup) + '</p>' +
          '<h3>The chain</h3><ol class="chain">' + chain.map((m) =>
            '<li><a href="#' + m.id + '">' + esc(m.acronym) + '</a> ' + esc(m.passes_on) + '</li>'
          ).join('') + '</ol>' +
          '<h3>Outcome</h3><p>' + esc(s.outcome) + '</p>' +
          '<h3>Examples vs. living catalogs</h3><p>Each type lists <strong>examples</strong> (specific models you can try today) and <strong>living catalogs</strong> (databases, hubs and leaderboards that keep adding new examples as they are released), so the page stays useful after the examples age.</p>';
      }

      function renderModel(m, step) {
        const flow = m.pipeline.map((p) => '<li>' + esc(p) + '</li>').join('');
        const dims = data.dimensions.map((d) => '<dt>' + esc(d) + '</dt><dd>' + esc(m.dimensions[d]) + '</dd>').join('');
        return '<h2>' + esc(m.acronym) + '<small>' + esc(m.name) + '</small></h2>' +
          '<p>' + esc(m.summary) + '</p>' +
          '<h3>Step ' + step + ' of 8 in the scenario</h3>' +
          '<div class="scenario"><p>' + esc(m.scenario_role) + '</p><span class="handoff">Passes on: ' + esc(m.passes_on) + '</span></div>' +
          '<h3>Pipeline</h3><ol class="steps">' + flow + '</ol>' +
          '<p style="margin-top:10px">' + esc(m.how) + '</p>' +
          '<div class="grid"><div><h3>Examples</h3>' + linkList(m.examples, 'by') + '</div>' +
          '<div><h3>Living catalogs</h3>' + linkList(m.catalogs, 'kind') +
          (m.note ? '<p class="note">' + esc(m.note) + '</p>' : '') + '</div></div>' +
          '<h3>Dimensions</h3><dl class="dims">' + dims + '</dl>';
      }

      function renderCompare() {
        // Four rows per table, so each table is one slide and the pager steps through them.
        const head = '<thead><tr><th>Type</th>' + data.dimensions.map((d) => '<th>' + esc(d) + '</th>').join('') + '</tr></thead>';
        const row = (m) => '<tr><td><a href="#' + m.id + '">' + esc(m.acronym) + '</a></td>' +
          data.dimensions.map((d) => '<td>' + esc(m.dimensions[d]) + '</td>').join('') + '</tr>';
        let tables = '';
        for (let i = 0; i < chain.length; i += 4) tables += '<table>' + head + '<tbody>' + chain.slice(i, i + 4).map(row).join('') + '</tbody></table>';
        return '<h2>Compare</h2><p>The five dimensions side by side, in scenario order.</p>' + tables;
      }

      // Pages: overview, the 8 models in scenario order, then the comparison.
      const defs = [{ id: 'overview', label: 'Overview', html: renderOverview() }]
        .concat(chain.map((m, i) => ({ id: m.id, label: m.acronym, html: renderModel(m, i + 1) })))
        .concat([{ id: 'compare', label: 'Compare', html: renderCompare(), wide: true }]);

      const pages = defs.map((d) => {
        const s = document.createElement('section');
        s.dataset.id = d.id;
        s.hidden = true;
        s.innerHTML = d.html;
        // Wrap everything after the heading in a column box that can be paged sideways.
        const cols = document.createElement('div');
        cols.className = 'cols' + (d.wide ? ' wide' : '');
        Array.from(s.children).filter((c) => c.tagName !== 'H2').forEach((c) => cols.appendChild(c));
        s.appendChild(cols);
        $('page').appendChild(s);
        return { id: d.id, label: d.label, el: s, cols };
      });

      $('tabs').innerHTML = pages.map((p, i) =>
        '<button class="tab" role="tab" data-id="' + p.id + '"><span class="step">' + (i + 1) + '</span>' + esc(p.label) + '</button>'
      ).join('');
      $('tabs').addEventListener('click', (e) => {
        const b = e.target.closest('.tab');
        if (b) go(b.dataset.id);
      });

      let index = 0, sub = 0;
      function step(p) { return p.cols.clientWidth + parseFloat(getComputedStyle(p.cols).columnGap || 0); }
      function subCount(p) { return Math.max(1, Math.round((p.cols.scrollWidth + step(p) - p.cols.clientWidth) / step(p))); }
      function render() {
        const p = pages[index];
        // Balance the columns when the tab fits on one screen; otherwise fill them in order.
        p.cols.classList.remove('balanced');
        if (subCount(p) === 1) p.cols.classList.add('balanced');
        const n = subCount(p);
        sub = Math.min(sub, n - 1);
        p.cols.scrollLeft = sub * step(p);
        $('prev').disabled = index === 0 && sub === 0;
        $('next').disabled = index === pages.length - 1 && sub === n - 1;
        $('count').innerHTML = (index + 1) + ' / ' + pages.length +
          (n > 1 ? (n > 6 ? ' <span class="sub">&middot; ' + (sub + 1) + ' of ' + n + '</span>'
            : ' <span class="dots">' + Array.from({ length: n }, (_, k) => '<i' + (k === sub ? ' class="on"' : '') + '></i>').join('') + '</span>') : '');
      }
      function go(id, atEnd) {
        const i = pages.findIndex((p) => p.id === id);
        index = i < 0 ? 0 : i;
        const p = pages[index];
        pages.forEach((q) => { q.el.hidden = q !== p; });
        document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.id === p.id));
        const active = document.querySelector('.tab[aria-selected="true"]');
        if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        sub = atEnd ? subCount(p) - 1 : 0;
        render();
        if (location.hash.slice(1) !== p.id) history.replaceState(null, '', '#' + p.id);
      }

      $('prev').addEventListener('click', () => {
        if (sub > 0) { sub--; render(); } else if (index > 0) go(pages[index - 1].id, true);
      });
      $('next').addEventListener('click', () => {
        if (sub < subCount(pages[index]) - 1) { sub++; render(); } else if (index < pages.length - 1) go(pages[index + 1].id);
      });
      window.addEventListener('resize', render);
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') $('prev').click();
        if (e.key === 'ArrowRight') $('next').click();
      });
      window.addEventListener('hashchange', () => go(location.hash.slice(1)));

      go(location.hash.slice(1));
    })();
  </script>
</body>
</html>
